name: CI

on:
  push:
  pull_request:

jobs:
  engine:
    name: C++ (${{ matrix.compiler }}, ${{ matrix.preset }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { compiler: gcc,   preset: release, cc: gcc,   cxx: g++ }
          - { compiler: clang, preset: release, cc: clang, cxx: clang++ }
          - { compiler: gcc,   preset: asan,    cc: gcc,   cxx: g++ }
          - { compiler: clang, preset: tsan,    cc: clang, cxx: clang++ }
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build clang \
            nlohmann-json3-dev libasio-dev libspdlog-dev libgtest-dev libbenchmark-dev
      - name: Configure
        run: cmake --preset ${{ matrix.preset }} -G Ninja -DTRAFFIC_FETCH_DEPS=OFF
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Test
        env:
          TSAN_OPTIONS: halt_on_error=1
          ASAN_OPTIONS: detect_leaks=1
        run: ctest --preset ${{ matrix.preset }} -j 2
      - name: Compare controllers (smoke)
        if: matrix.preset == 'release'
        run: ./build/release/traffic_cli compare config/scenarios/uneven-demand.json --seeds 3 --duration 600

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-24.04
    needs: [engine, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t smart-traffic-simulator .
      - name: Smoke test the container
        run: |
          docker run -d --name sim -p 8080:8080 smart-traffic-simulator
          for i in $(seq 1 30); do curl -fsS localhost:8080/api/v1/health && break; sleep 1; done
          curl -fsS localhost:8080/api/v1/scenarios
          docker logs sim
